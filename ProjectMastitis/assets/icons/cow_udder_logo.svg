<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="udderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD1DC"/>
      <stop offset="60%" stop-color="#FFB6C1"/>
      <stop offset="100%" stop-color="#FF9AA2"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00695C"/>
      <stop offset="50%" stop-color="#00897B"/>
      <stop offset="100%" stop-color="#26A69A"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F2F1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#00251A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Health Shield / Emblem -->
  <path d="M 100 12 C 145 12 182 28 182 60 C 182 125 100 185 100 185 C 100 185 18 125 18 60 C 18 28 55 12 100 12 Z" 
        fill="url(#shieldGrad)" filter="url(#shadow)"/>

  <!-- Golden Ring Trim -->
  <path d="M 100 18 C 140 18 174 32 174 62 C 174 120 100 176 100 176 C 100 176 26 120 26 62 C 26 32 60 18 100 18 Z" 
        fill="none" stroke="#80CBC4" stroke-width="2.5" opacity="0.6"/>

  <!-- Medical Cross Accent in Header -->
  <path d="M 95 30 H 105 V 40 H 115 V 50 H 105 V 60 H 95 V 50 H 85 V 40 H 95 Z" 
        fill="url(#crossGrad)" opacity="0.95"/>

  <!-- Cow Udder Anatomy Bag (Suspension Body) -->
  <path d="M 52 78 C 50 110, 70 126, 100 126 C 130 126, 150 110, 148 78 C 146 66, 134 62, 100 62 C 66 62, 54 66, 52 78 Z" 
        fill="url(#udderGrad)" stroke="#E57373" stroke-width="2.5"/>

  <!-- Median Suspensory Ligament Line -->
  <path d="M 100 68 C 100 88, 100 104, 100 125" 
        fill="none" stroke="#E57373" stroke-width="2" stroke-dasharray="3,3" opacity="0.75"/>

  <!-- Teat 1: Left Fore (LF) -->
  <path d="M 64 116 C 64 116, 60 144, 66 148 C 72 152, 76 144, 76 118 Z" 
        fill="url(#udderGrad)" stroke="#E57373" stroke-width="2"/>
  <circle cx="68" cy="147" r="1.5" fill="#C62828"/>

  <!-- Teat 2: Left Rear (LR) -->
  <path d="M 86 124 C 86 124, 84 150, 89 153 C 94 156, 98 149, 97 124 Z" 
        fill="url(#udderGrad)" stroke="#E57373" stroke-width="2"/>
  <circle cx="90" cy="152" r="1.5" fill="#C62828"/>

  <!-- Teat 3: Right Rear (RR) -->
  <path d="M 103 124 C 102 149, 106 156, 111 153 C 116 150, 114 124, 114 124 Z" 
        fill="url(#udderGrad)" stroke="#E57373" stroke-width="2"/>
  <circle cx="110" cy="152" r="1.5" fill="#C62828"/>

  <!-- Teat 4: Right Fore (RF) -->
  <path d="M 124 118 C 124 144, 128 152, 134 148 C 140 144, 136 116, 136 116 Z" 
        fill="url(#udderGrad)" stroke="#E57373" stroke-width="2"/>
  <circle cx="132" cy="147" r="1.5" fill="#C62828"/>

  <!-- Sub-clinical Diagnostic Sparkle / CMT Droplet Sparkle -->
  <circle cx="148" cy="62" r="4.5" fill="#FFF59D"/>
  <path d="M 148 53 L 148 71 M 139 62 L 157 62" stroke="#FFF59D" stroke-width="2" stroke-linecap="round"/>

</svg>
